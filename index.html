<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or system) theme before first paint so dark mode never flashes white
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}

      // Opening animation: once per browser session, and never for reduced motion. The cover below is
      // painted straight away so the half-loaded page never flashes; the app animates it away.
      try {
        if (!sessionStorage.getItem('intro-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('intro')
          // Failsafe: if the app hasn't taken over the cover after a while, don't leave it up
          setTimeout(function () {
            var cover = document.getElementById('intro')
            if (!cover || !cover.classList.contains('is-live')) document.documentElement.classList.remove('intro')
          }, 6000)
        }
      } catch (e) {}
    </script>
    <style>
      #intro { display: none; }
      .intro #intro { display: block; position: fixed; inset: 0; z-index: 100; background: #be1a1a; overflow: hidden; }
      .intro body { overflow: hidden; }
    </style>
    <meta name="description" content="On the founding team of a stealth AI startup and building open-source tooling for AI agents, from observability to governance. Shipping AI systems people actually use." />
    <title>Ananthu Narashimman | Agentic AI, Developer Tools, Full-Stack</title>
    <link rel="canonical" href="https://ananthu-two.vercel.app/" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack, Discord…). Crawlers need absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ananthu Narashimman" />
    <meta property="og:title" content="Ananthu Narashimman | Agentic AI, Developer Tools, Full-Stack" />
    <meta property="og:description" content="On the founding team of a stealth AI startup and building open-source tooling for AI agents, from observability to governance. Shipping AI systems people actually use." />
    <meta property="og:url" content="https://ananthu-two.vercel.app/" />
    <meta property="og:image" content="https://ananthu-two.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ananthu Narashimman, shipping AI systems people actually use: a cartoon portrait bursting through a crimson pixel-art card" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ananthu Narashimman | Agentic AI, Developer Tools, Full-Stack" />

    <meta name="theme-color" content="#be1a1a" />
    <link rel="preload" href="/fonts/GeneralSans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeneralSans-500.woff2" as="font" type="font/woff2" crossorigin />
  </head>

    <div id="intro" aria-hidden="true"></div>
