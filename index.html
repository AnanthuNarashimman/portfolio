<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved (or system) theme before first paint so dark mode never flashes white
      try {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}

      // Opening animation: once per browser session, and never for reduced motion. The cover below is
      // painted straight away so the half-loaded page never flashes; the app animates it away.
      try {
        if (!sessionStorage.getItem('intro-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.classList.add('intro')
          // Failsafe: if the app hasn't taken over the cover after a while, don't leave it up
          setTimeout(function () {
            var cover = document.getElementById('intro')
            if (!cover || !cover.classList.contains('is-live')) document.documentElement.classList.remove('intro')
          }, 6000)
        }
      } catch (e) {}
    </script>
    <style>
      #intro { display: none; }
      .intro #intro { display: block; position: fixed; inset: 0; z-index: 100; background: #be1a1a; overflow: hidden; }
      .intro body { overflow: hidden; }
    </style>
    <meta name="description" content="On the founding team of a stealth AI startup and building open-source tooling for AI agents — from observability to governance. Shipping AI systems people actually use." />
    <title>Ananthu Narashimman — Agentic AI, Developer Tools, Full-Stack</title>
    <link rel="preload" href="/fonts/GeneralSans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeneralSans-500.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="intro" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
